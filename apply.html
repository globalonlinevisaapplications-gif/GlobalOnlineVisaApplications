
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visa Application</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 20px;
    }
    main {
      max-width: 650px;
      margin: 30px auto;
    }
    .container {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #0001;
    }
    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }
    input, select, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }
    button {
      background: #0756a5;
      color: white;
      border: 0;
      margin-top: 24px;
      cursor: pointer;
    }
    button:disabled {
      opacity: 0.6;
    }
    #message {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
<main>
  <div class="container">
    <h2>Global Online Visa Application</h2>
    <p id="loginNotice" class="hidden">
      Please sign in before applying.
      <a href="index.html">Go to sign in</a>
    </p>

    <form id="applicationForm" class="hidden">
      <h3>Personal Information</h3>

      <label for="firstName">First Name</label>
      <input id="firstName" required maxlength="100">

      <label for="lastName">Last Name</label>
      <input id="lastName" required maxlength="100">

      <label for="email">Email Address</label>
      <input id="email" type="email" required>

      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" required maxlength="30">

      <label for="nationality">Nationality</label>
      <input id="nationality" required maxlength="100">

      <label for="passport">Passport Number</label>
      <input id="passport" required maxlength="50">

      <label for="dob">Date of Birth</label>
      <input id="dob" type="date" required>

      <h3 style="margin-top:28px">Visa Information</h3>

      <label for="destination">Destination Country</label>
      <select id="destination" required>
        <option value="">Loading countries...</option>
      </select>

      <label for="visaType">Visa Type</label>
      <select id="visaType" required disabled>
        <option value="">Choose a destination first</option>
      </select>

      <button id="submitButton" type="submit">
        Submit Visa Application
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
  </div>
</main>

<script>
  const message = document.getElementById("message");
  const form = document.getElementById("applicationForm");
  const loginNotice = document.getElementById("loginNotice");
  const submitButton = document.getElementById("submitButton");
  const countrySelect = document.getElementById("destination");
  const visaSelect = document.getElementById("visaType");

  let db;
  let currentUser;
  let countries = [];

  async function backendRequest(payload) {
    const { data: sessionData, error: sessionError } =
      await db.auth.getSession();

    if (sessionError) throw sessionError;

    const token = sessionData.session?.access_token;

    if (!token) {
      throw new Error("Please sign in again.");
    }

    const response = await fetch(window.SUPABASE_FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + token,
        "apikey": window.SUPABASE_ANON_KEY
      },
      body: JSON.stringify(payload)
    });

    const result = await response.json();

    if (!response.ok || result.error) {
      throw new Error(result.error || "The request could not be completed.");
    }

    return result;
  }

  async function startApplication() {
    try {
      if (!window.SUPABASE_URL ||
          !window.SUPABASE_ANON_KEY ||
          !window.SUPABASE_FUNCTION_URL) {
        throw new Error("Supabase configuration is missing.");
      }

      db = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );

      const { data, error } = await db.auth.getUser();

      if (error || !data.user) {
        loginNotice.classList.remove("hidden");
        message.textContent = "Please sign in to continue.";
        return;
      }

      currentUser = data.user;
      form.classList.remove("hidden");

      document.getElementById("email").value =
        currentUser.email || "";

      const profile = currentUser.user_metadata || {};
      document.getElementById("firstName").value =
        profile.first_name || "";
      document.getElementById("lastName").value =
        profile.last_name || "";

      await loadCountries();

    } catch (error) {
      message.textContent = error.message;
    }
  }

  async function loadCountries() {
    countrySelect.innerHTML =
      '<option value="">Loading countries...</option>';

    const result = await backendRequest({
      action: "countries"
    });

    countries = result.countries || [];

    countrySelect.innerHTML =
      '<option value="">Choose a destination country</option>';

    countries.forEach(country => {
      const option = document.createElement("option");
      option.value = country.id;
      option.textContent = country.country_name;
      countrySelect.appendChild(option);
    });

    if (countries.length === 0) {
      message.textContent =
        "No destination countries are available yet.";
    }
  }

  async function loadVisaTypes(countryId) {
    visaSelect.disabled = true;
    visaSelect.innerHTML =
      '<option value="">Loading visa types...</option>';

    try {
      const result = await backendRequest({
        action: "visa_types",
        country_id: countryId
      });

      const visaTypes = result.visa_types || [];

      visaSelect.innerHTML =
        '<option value="">Choose a visa type</option>';

      visaTypes.forEach(visa => {
        const option = document.createElement("option");
        option.value = visa.id;

        let label = visa.visa_name;

        if (visa.visa_fee !== null) {
          label += " - Fee: " + visa.visa_fee;
        }

        if (visa.processing_days !== null) {
          label += " - " + visa.processing_days + " days";
        }

        option.textContent = label;
        visaSelect.appendChild(option);
      });

      visaSelect.disabled = false;

      if (visaTypes.length === 0) {
        message.textContent =
          "No visa types are available for this country yet.";
      } else {
        message.textContent = "";
      }

    } catch (error) {
      visaSelect.innerHTML =
        '<option value="">Could not load visa types</option>';
      message.textContent = error.message;
    }
  }

  countrySelect.addEventListener("change", async function() {
    const countryId = countrySelect.value;

    visaSelect.innerHTML =
      '<option value="">Choose a destination first</option>';

    visaSelect.disabled = true;

    if (countryId) {
      await loadVisaTypes(countryId);
    }
  });

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (!currentUser) {
      message.textContent = "Please sign in again.";
      return;
    }

    const payload = {
      action: "submit",
      first_name: document.getElementById("firstName").value.trim(),
      last_name: document.getElementById("lastName").value.trim(),
      email: document.getElementById("email").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      nationality: document.getElementById("nationality").value.trim(),
      passport_number: document.getElementById("passport").value.trim(),
      date_of_birth: document.getElementById("dob").value,
      country_id: countrySelect.value,
      visa_type_id: visaSelect.value
    };

    if (Object.entries(payload).some(([key, value]) =>
      key !== "action" && !value
    )) {
      message.textContent = "Please complete every field.";
      return;
    }

    submitButton.disabled = true;
    message.textContent = "Submitting your application...";

    try {
      const result = await backendRequest(payload);

      const reference =
        result.application_id || result.id || "Submitted";

      message.textContent =
        "Your application was submitted successfully. Reference: " +
        reference;

      form.reset();
      visaSelect.disabled = true;

    } catch (error) {
      console.error(error);
      message.textContent = "Submission failed: " + error.message;
    } finally {
      submitButton.disabled = false;
    }
  });

  startApplication();
</script>
</body>
</html>
