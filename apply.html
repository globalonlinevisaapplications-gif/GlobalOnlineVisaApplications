
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visa Application | Global Online Visa Applications</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fa;
      color: #172033;
    }
    header {
      background: #082b50;
      color: white;
      padding: 20px;
      text-align: center;
    }
    header a { color: white; }
    main {
      max-width: 750px;
      margin: 30px auto;
      padding: 20px;
    }
    .panel {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 15px #00000010;
    }
    h2 { color: #082b50; }
    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }
    input, select {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #ccd4df;
      border-radius: 5px;
      font-size: 15px;
      background: white;
    }
    button {
      background: #12639a;
      color: white;
      border: 0;
      border-radius: 5px;
      padding: 14px 20px;
      width: 100%;
      margin-top: 22px;
      font-size: 16px;
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: wait; }
    #message {
      margin-top: 18px;
      overflow-wrap: anywhere;
    }
    .note { color: #596579; font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>

<body>
<header>
  <h1>Global Online Visa Applications</h1>
  <a href="index.html">Return to Home</a>
</header>

<main>
  <div class="panel">
    <h2>Visa Application Form</h2>
    <p class="note">Complete your details carefully before submitting.</p>

    <div id="loginNotice" class="hidden">
      <p>You must sign in before submitting a visa application.</p>
      <a href="index.html#account">Go to Applicant Sign In</a>
    </div>

    <form id="applicationForm" class="hidden">

      <h3>Personal Information</h3>

      <label for="firstName">First Name</label>
      <input id="firstName" required maxlength="100" autocomplete="given-name">

      <label for="lastName">Last Name</label>
      <input id="lastName" required maxlength="100" autocomplete="family-name">

      <label for="phone">Phone Number</label>
      <input id="phone" type="tel" required maxlength="30" autocomplete="tel">

      <label for="nationality">Nationality</label>
      <input id="nationality" required maxlength="100">

      <label for="passport">Passport Number</label>
      <input id="passport" required maxlength="50" autocomplete="off">

      <label for="dob">Date of Birth</label>
      <input id="dob" type="date" required>

      <h3 style="margin-top:28px">Visa Information</h3>

      <label for="destination">Preferred Destination Country</label>
      <input id="destination" required maxlength="100"
             placeholder="Enter your preferred destination">

      <label for="visaType">Visa Type</label>
      <select id="visaType" required>
        <option value="">Loading visa types...</option>
      </select>

      <button id="submitButton" type="submit">
        Submit Visa Application
      </button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
  </div>
</main>

<script>
  const message = document.getElementById("message");
  const form = document.getElementById("applicationForm");
  const loginNotice = document.getElementById("loginNotice");
  const submitButton = document.getElementById("submitButton");

  let db = null;
  let currentUser = null;

  async function startApplication() {
    try {
      if (!window.SUPABASE_URL || !window.SUPABASE_ANON_KEY) {
        throw new Error("Supabase configuration is missing.");
      }

      db = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
      );

      const { data, error } = await db.auth.getUser();

      if (error || !data.user) {
        loginNotice.classList.remove("hidden");
        message.textContent = "Please sign in to continue.";
        return;
      }

      currentUser = data.user;
      form.classList.remove("hidden");

      const profile = currentUser.user_metadata || {};
      document.getElementById("firstName").value =
        profile.first_name || "";
      document.getElementById("lastName").value =
        profile.last_name || "";

      await loadVisaTypes();

    } catch (error) {
      message.textContent = error.message;
    }
  }

  async function loadVisaTypes() {
    const select = document.getElementById("visaType");

    const { data, error } = await db
      .from("visa_types")
      .select("id, visa_name, visa_fee, processing_days")
      .order("visa_name");

    if (error) {
      select.innerHTML = '<option value="">Could not load visa types</option>';
      message.textContent =
        "Unable to load visa types: " + error.message;
      return;
    }

    select.innerHTML = '<option value="">Choose a visa type</option>';

    for (const visa of data || []) {
      const option = document.createElement("option");
      option.value = visa.id;

      let label = visa.visa_name;
      if (visa.visa_fee !== null) {
        label += " - Fee: " + visa.visa_fee;
      }
      if (visa.processing_days !== null) {
        label += " - " + visa.processing_days + " processing days";
      }

      option.textContent = label;
      select.appendChild(option);
    }

    if (!data || data.length === 0) {
      message.textContent =
        "No visa types are available yet. Please contact the administrator.";
    }
  }

  form.addEventListener("submit", async function(event) {
    event.preventDefault();

    if (!currentUser) {
      message.textContent = "Please sign in again.";
      return;
    }

    const payload = {
      first_name: document.getElementById("firstName").value.trim(),
      last_name: document.getElementById("lastName").value.trim(),
      phone: document.getElementById("phone").value.trim(),
      nationality: document.getElementById("nationality").value.trim(),
      passport_number: document.getElementById("passport").value.trim(),
      date_of_birth: document.getElementById("dob").value,
      preferred_country: document.getElementById("destination").value.trim(),
      visa_type_id: document.getElementById("visaType").value
    };

    if (Object.values(payload).some(value => !value)) {
      message.textContent = "Please complete every field.";
      return;
    }

    submitButton.disabled = true;
    message.textContent = "Submitting your application...";

    try {
      const { data, error } = await db.functions.invoke(
        "submit-visa-application",
        { body: payload }
      );

      if (error) throw error;
      if (!data || data.error) {
        throw new Error(data?.error || "Application submission failed.");
      }

      message.textContent =
        "Your application was submitted successfully. Your application reference is: " +
        (data.application_id || data.id || "Submitted");

      form.reset();

    } catch (error) {
      console.error(error);
      message.textContent =
        "Submission failed: " + (error.message || "Please try again.");
    } finally {
      submitButton.disabled = false;
    }
  });

  startApplication();
</script>
</body>
</html>
